climaoro:
  module: climaoro
  class: Climaoro

  # URL base di HA (nessun entity_id qui: tutto viene risolto da
  # /api/climaoro/config esposta dal custom component).
  # Nell'addon AppDaemon il provisioning genera questo file con
  # ha_url: http://supervisor/core (l'app usa SUPERVISOR_TOKEN).
  ha_url: http://supervisor/core
  token: "<INSERT_LONG_LIVED_HA_TOKEN>"

  # Opzionali (default indicati):
  # refresh_sec: 600    # quanto spesso rileggere la config runtime
  # cycle_sec: 60       # quanto spesso girare il ciclo di controllo
  # rinnovo_sec: 240    # quanto spesso premere i pulsanti rinnovo
