# Dashboard "Climaoro" - NON configurare a mano.
#
# La dashboard Lovelace "Climaoro" viene creata/aggiornata dinamicamente
# dal tool tools/make_dashboard.py, che costruisce le card dagli
# entity_id risolti da /api/climaoro/config (nessun entity_id hardcoded):
#
#   python tools/make_dashboard.py --url http://192.168.1.132:80 \
#       --token <long-lived-token>
#
# url_path: climaoro-panel (deve contenere un trattino). L'utente può
# comunque editarla nella UI (modalità storage).
#
# Struttura generata: card "Climaoro - Globale" (attivo, soglia pesi) +
# una card per gruppo (delta comfort/eco, calendario) + una card per
# stanza (climate, temp_salvata, peso, inclusione, modalita, rinnovo).
