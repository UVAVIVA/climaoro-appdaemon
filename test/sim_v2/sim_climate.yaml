- platform: generic_thermostat
  name: Termostato Autonomo 1 Climatizzazione
  unique_id: sim_clima_1
  heater: input_boolean.sim_termostato_1_riscaldamento
  target_sensor: sensor.termostato_autonomo_1_temperatura_attuale
  min_temp: 10
  max_temp: 30
  target_temp: 20
  cold_tolerance: 0.3
  hot_tolerance: 0.5
  min_cycle_duration:
    seconds: 5
  initial_hvac_mode: heat
- platform: generic_thermostat
  name: Termostato Autonomo 2 Climatizzazione
