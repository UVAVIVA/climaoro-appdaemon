  target_sensor: sensor.termostato_autonomo_2_temperatura_attuale
  min_temp: 10
  max_temp: 30
  target_temp: 20
  cold_tolerance: 0.3
  hot_tolerance: 0.5
  min_cycle_duration:
    seconds: 5
  initial_hvac_mode: heat
