# ---- Entita simulate Climaoro per test (NON in produzione) ----
input_number:
  sim_termostato_1_temperatura_salvata:
    name: Sim Temp Salvata 1
    min: 10
    max: 30
    step: 0.5
    initial: 20
  sim_termostato_1_temperatura_attuale:
    name: Sim Temp Attuale 1
    min: 5
    max: 35
    step: 0.5
    initial: 18

input_boolean:
  sim_termostato_1_modalita_centralizzata:
    name: Sim Modalita Centralizzata 1

input_button:
  sim_termostato_1_rinnova:
    name: Sim Rinnova 1

template:
  climate:
    - name: Termostato Autonomo 1 Climatizzazione
      unique_id: sim_clima_1
      min_temp: 10
      max_temp: 30
      temp_step: 0.5
      current_temperature: '{{ states("input_number.sim_termostato_1_temperatura_attuale") }}'
      set_temperature:
        service: input_number.set_value
        target:
          entity_id: input_number.sim_termostato_1_temperatura_attuale
        data:
          value: '{{ temperature }}'
      hvac_modes:
        - heat
        - "off"
      hvac_mode: heat
      target_temp: 19

  number:
    - name: Termostato Autonomo 1 Temperatura Salvata
      unique_id: sim_temp_salvata_1
      state: '{{ states("input_number.sim_termostato_1_temperatura_salvata") }}'
      min: 10
      max: 30
      step: 0.5
      unit_of_measurement: "°C"
      set_value:
        service: input_number.set_value
        target:
          entity_id: input_number.sim_termostato_1_temperatura_salvata
        data:
          value: '{{ value }}'

  switch:
    - name: Termostato Autonomo 1 Modalita Centralizzata
      unique_id: sim_modalita_1
      state: '{{ states("input_boolean.sim_termostato_1_modalita_centralizzata") }}'
      turn_on:
        service: input_boolean.turn_on
        target:
          entity_id: input_boolean.sim_termostato_1_modalita_centralizzata
      turn_off:
        service: input_boolean.turn_off
        target:
          entity_id: input_boolean.sim_termostato_1_modalita_centralizzata

  button:
    - name: Termostato Autonomo 1 Rinnova Modalita Centralizzata
      unique_id: sim_rinnovo_1
      press:
        service: input_button.press
        target:
          entity_id: input_button.sim_termostato_1_rinnova
